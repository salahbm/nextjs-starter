name: Vercel Preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Vercel preview skipped because VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID is missing."
          fi

      - name: Checkout
        if: steps.vercel.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.vercel.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.vercel.outputs.enabled == 'true'
        run: bun install --frozen-lockfile

      - name: Pull Vercel environment
        if: steps.vercel.outputs.enabled == 'true'
        run: bunx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        if: steps.vercel.outputs.enabled == 'true'
        run: bunx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: steps.vercel.outputs.enabled == 'true'
        run: bunx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
